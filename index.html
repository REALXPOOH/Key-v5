<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REALXPOOH - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Prompt', sans-serif; 
            background: radial-gradient(circle at center, #111827 0%, #0b0f19 100%);
            color: #fff; 
        }
        .glow-box {
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.15);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <!-- 1. หน้าจอสร้าง License Key (Admin Panel) -->
    <div id="adminPage" class="bg-[#121826]/90 backdrop-blur-xl w-full max-w-md p-6 rounded-3xl shadow-2xl border border-gray-800 glow-box space-y-6">
        
        <!-- Header -->
        <div class="flex items-center gap-2 border-b border-gray-800/80 pb-3">
            <span class="bg-blue-500/20 text-blue-400 text-xs font-bold px-2 py-1 rounded-lg border border-blue-500/30">➕</span>
            <h2 class="text-base font-bold tracking-wider text-blue-400">สร้าง License Key</h2>
        </div>

        <div class="space-y-4 text-xs">
            <!-- รูปแบบการสร้างคีย์ -->
            <div class="space-y-1.5">
                <label class="text-gray-300 font-medium">รูปแบบการสร้างคีย์</label>
                <select class="w-full bg-[#1a2234] border border-gray-700/80 rounded-xl px-3 py-3 text-white focus:outline-none focus:border-blue-500 transition">
                    <option>สุ่มคีย์อัตโนมัติ</option>
                </select>
            </div>

            <!-- ลบีย์ (Delete Key) -->
            <div class="space-y-1.5">
                <label class="text-gray-300 font-medium">ลบคีย์ (Delete Key)</label>
                <div class="flex gap-2">
                    <input type="text" placeholder="พิมพ์คีย์ที่ต้องการลบ..." class="w-full bg-[#1a2234] border border-gray-700/80 rounded-xl px-3 py-2.5 text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 font-mono">
                    <button class="bg-red-600/80 hover:bg-red-600 text-white font-medium px-4 py-2.5 rounded-xl transition cursor-pointer">ลบ</button>
                </div>
            </div>

            <!-- จำนวน -->
            <div class="space-y-1.5">
                <label class="text-gray-300 font-medium">จำนวน (เช่น 1000)</label>
                <input type="number" id="keyCount" value="1" min="1" class="w-full bg-[#1a2234] border border-gray-700/80 rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-blue-500 font-mono">
            </div>

            <!-- โหมดเวลา -->
            <div class="space-y-1.5">
                <label class="text-gray-300 font-medium">โหมดเวลา</label>
                <select class="w-full bg-[#1a2234] border border-gray-700/80 rounded-xl px-3 py-3 text-white focus:outline-none focus:border-blue-500 transition">
                    <option>วัน (Preset)</option>
                </select>
            </div>

            <!-- อายุการใช้งาน (กำหนดกี่วันก็ได้) -->
            <div class="space-y-1.5">
                <label class="text-gray-300 font-medium">อายุการใช้งาน (จำนวนวัน)</label>
                <input type="number" id="keyDays" value="1" min="1" placeholder="ใส่จำนวนวัน เช่น 1, 7, 30 หรือมากกว่านั้น" class="w-full bg-[#1a2234] border border-gray-700/80 rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-blue-500 font-mono">
            </div>

            <!-- หมายเหตุ -->
            <div class="space-y-1.5">
                <label class="text-gray-300 font-medium">หมายเหตุ (OPTIONAL)</label>
                <input type="text" placeholder="เช่น ลูกค้า A" class="w-full bg-[#1a2234] border border-gray-700/80 rounded-xl px-3 py-2.5 text-white placeholder-gray-500 focus:outline-none focus:border-blue-500">
            </div>

            <!-- ปุ่ม Generate และ รีเซ็ต -->
            <div class="flex gap-2 pt-2">
                <button onclick="generateKeys()" class="flex-1 bg-gradient-to-r from-blue-600 to-indigo-600 hover:opacity-95 text-white font-medium py-3 rounded-xl transition shadow-lg shadow-blue-600/20 cursor-pointer flex items-center justify-center gap-1.5 text-sm">
                    ✨ Generate
                </button>
                <button class="bg-[#1a2234] hover:bg-gray-800 text-gray-300 font-medium px-5 py-3 rounded-xl border border-gray-700 transition cursor-pointer">
                    รีเซ็ต
                </button>
            </div>
        </div>
    </div>

    <!-- Modal แสดงคีย์ที่สร้างสำเร็จ -->
    <div id="resultModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 hidden">
        <div class="bg-[#121826] border border-gray-800 w-full max-w-md p-6 rounded-3xl space-y-4 glow-box">
            <div class="flex justify-between items-center border-b border-gray-800 pb-3">
                <h3 class="text-sm font-bold text-blue-400">สร้าง License Key สำเร็จ!</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-white cursor-pointer text-sm">✕</button>
            </div>
            <div id="keyListDisplay" class="bg-[#1a2234] p-3 rounded-xl font-mono text-xs text-blue-300 max-h-48 overflow-y-auto space-y-1 border border-gray-800">
                <!-- รายการคีย์จะแสดงตรงนี้ -->
            </div>
            <div class="flex gap-2">
                <button onclick="simulateLogin()" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white py-2.5 rounded-xl text-xs font-medium transition cursor-pointer">
                    🚀 ไปลองทดสอบเข้าใช้งานคีย์นี้
                </button>
                <button onclick="closeModal()" class="bg-gray-800 hover:bg-gray-700 text-gray-300 px-4 py-2.5 rounded-xl text-xs transition cursor-pointer">
                    ปิด
                </button>
            </div>
        </div>
    </div>

    <!-- 2. หน้าจอผู้ใช้สำหรับทดสอบนำคีย์ไปกรอก (จำลองระบบผู้เล่น) -->
    <div id="clientPage" class="bg-[#121826]/90 backdrop-blur-xl w-full max-w-md p-6 rounded-3xl shadow-2xl border border-gray-800 glow-box space-y-6 hidden relative pb-24">
        <div class="flex justify-between items-center border-b border-gray-800/80 pb-4">
            <div class="flex items-center gap-2">
                <span class="bg-blue-500/20 text-blue-400 text-xs font-bold px-2.5 py-1 rounded-lg border border-blue-500/30">🔥</span>
                <h1 class="font-bold text-lg tracking-wider text-blue-400">REALXPOOH</h1>
            </div>
            <button onclick="backToAdmin()" class="text-gray-400 hover:text-white bg-[#1a2234] px-3 py-1.5 rounded-lg text-xs transition border border-gray-700 cursor-pointer">กลับหน้าสร้างคีย์</button>
        </div>

        <div class="space-y-4">
            <div class="bg-[#1a2234]/60 border border-gray-800 p-4 rounded-2xl space-y-1">
                <span class="text-xs text-gray-400 font-medium">🔑 LICENSE KEY</span>
                <div id="displayKey" class="text-sm font-mono text-blue-400 font-semibold">-</div>
            </div>

            <div class="bg-[#1a2234]/60 border border-blue-500/20 p-4 rounded-2xl space-y-1">
                <span class="text-xs text-blue-400/90 font-medium">⏳ SUBSCRIPTION EXPIRE</span>
                <div id="countdownTimer" class="text-blue-300 font-mono text-lg font-bold">กำลังโหลด...</div>
            </div>
        </div>
    </div>

    <!-- Script ควบคุมระบบสร้างคีย์และการนับถอยหลัง -->
    <script>
        let generatedKeyToTest = "";
        let testKeyDays = 1;
        let timerInterval = null;

        function generateKeys() {
            const count = parseInt(document.getElementById('keyCount').value) || 1;
            const days = parseInt(document.getElementById('keyDays').value) || 1;
            const listDisplay = document.getElementById('keyListDisplay');
            listDisplay.innerHTML = "";

            let firstKey = "";

            for (let i = 0; i < count; i++) {
                // รูปแบบคีย์: realxpooh-[จำนวนวัน]d-[สุ่มเลข 10 ตัว]
                const randomNum = Math.floor(1000000000 + Math.random() * 9000000000);
                const newKey = `realxpooh-${days}d-${randomNum}`;
                
                if (i === 0) firstKey = newKey;

                const div = document.createElement('div');
                div.innerText = newKey;
                listDisplay.appendChild(div);
            }

            generatedKeyToTest = firstKey;
            testKeyDays = days;
            document.getElementById('resultModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('resultModal').classList.add('hidden');
        }

        function simulateLogin() {
            closeModal();
            document.getElementById('adminPage').classList.add('hidden');
            document.getElementById('clientPage').classList.remove('hidden');
            
            document.getElementById('displayKey').innerText = generatedKeyToTest;

            // แปลงจำนวนวันที่ตั้งค่าไว้ให้เป็นวินาทีจริงเพื่อใช้นับถอยหลัง
            let totalSeconds = testKeyDays * 24 * 60 * 60;
            startTimer(totalSeconds);
        }

        function startTimer(seconds) {
            clearInterval(timerInterval);
            let totalSeconds = seconds;

            timerInterval = setInterval(() => {
                if (totalSeconds > 0) {
                    totalSeconds--;
                    let days = Math.floor(totalSeconds / (3600 * 24));
                    let hours = Math.floor((totalSeconds % (3600 * 24)) / 3600);
                    let minutes = Math.floor((totalSeconds % 3600) / 60);
                    let secs = totalSeconds % 60;

                    let timeString = "";
                    if (days > 0) timeString += `${days}วัน `;
                    timeString += `${hours}ชม. ${minutes}นาที ${secs}วินาที`;

                    document.getElementById('countdownTimer').innerText = timeString;
                } else {
                    document.getElementById('countdownTimer').innerText = "หมดอายุแล้ว!";
                    clearInterval(timerInterval);
                    alert("License Key หมดอายุแล้ว! เตะออกจากระบบ");
                    backToAdmin();
                }
            }, 1000);
        }

        function backToAdmin() {
            clearInterval(timerInterval);
            document.getElementById('clientPage').classList.add('hidden');
            document.getElementById('adminPage').classList.remove('hidden');
        }
    </script>
</body>
</html>
